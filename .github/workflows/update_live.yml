name: Update YouTube Live M3U

on:
  schedule:
    # Berjalan otomatis setiap 1 jam sekali
    - cron: '0 * * * *'
  workflow_dispatch: # Memungkinkan tombol Run Manual di tab Actions

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp requests
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Script to Generate M3U
        run: python youtube_live_m3u.py

      - name: Commit and Push Changes if Playlist Updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add YouTube_Live_Stream.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update YouTube Live M3U playlist [skip ci]" && git push)
